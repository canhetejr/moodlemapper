<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moodle Mapper</title>
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #151515;
    --border: rgba(255,255,255,0.12);
    --lime: #c6ff3d;
    --text: #f5f5f0;
    --muted: #9a9a9a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Helvetica Neue Condensed", "Arial Narrow", "Inter", system-ui, sans-serif;
    width: 380px;
    padding: 16px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .brand .mark {
    width: 20px;
    height: 20px;
    background: var(--lime);
    color: #0b0b0b;
    font-weight: 900;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .brand .word {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  h1 {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 6px 0 4px;
    color: var(--text);
  }
  h1 span { color: var(--lime); }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }

  p.hint {
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
    margin: 6px 0 14px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }

  label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin: 10px 0 5px;
    color: var(--muted);
  }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    padding: 8px;
  }
  textarea { height: 90px; resize: vertical; }
  textarea::placeholder, input::placeholder { color: #5a5a5a; }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--lime);
  }

  .row { display: flex; gap: 8px; margin-top: 14px; }

  button {
    flex: 1;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 999px;
    transition: opacity 0.15s ease;
  }
  button.primary {
    background: var(--lime);
    color: #0b0b0b;
  }
  button.primary:hover { opacity: 0.88; }
  button:not(.primary) {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  button:not(.primary):hover { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: default; }

  #summary {
    font-size: 12px;
    font-weight: 700;
    margin-top: 12px;
    color: var(--lime);
  }

  #log {
    margin-top: 10px;
    font-size: 11px;
    font-family: "SFMono-Regular", Consolas, monospace;
    max-height: 150px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 8px;
    white-space: pre-wrap;
    color: #cfcfcf;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">T.</div>
    <div class="word">Tera</div>
  </div>

  <p class="eyebrow">Automação · Moodle</p>
  <h1>Moodle <span>Mapper</span></h1>
  <p class="hint">Cole os IDs dos cursos (um por linha, ou separados por vírgula/espaço — URLs completas também funcionam). A aba ativa precisa estar logada no Moodle.</p>

  <label for="ids">IDs / URLs dos cursos</label>
  <textarea id="ids" placeholder="123&#10;124&#10;https://seu-moodle.com/course/view.php?id=125"></textarea>

  <label for="baseUrl">Base do Moodle (opcional)</label>
  <input type="text" id="baseUrl" placeholder="Detectada da aba ativa se vazio">

  <div class="row">
    <button id="run" class="primary">Mapear e gerar .xlsx</button>
    <button id="clear">Limpar log</button>
  </div>

  <div id="summary"></div>
  <div id="log"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
